# Version catalog for portage.
# NOTE: versions below are baselines from late-2025/early-2026. The brief mandates
# targeting the CURRENT GrapheneOS Android version — verify + bump AGP / compileSdk /
# Compose BOM at build time rather than trusting these pins.

[versions]
# Build
agp = "8.9.1"                 # verify latest stable at build time
kotlin = "2.4.0"             # K2; Compose compiler is bundled via the kotlin compose plugin
ksp = "2.1.21-2.0.1"
# SDK levels — Pixel 6 and newer (Tensor era)
minSdk = "31"                 # Android 12 = Pixel 6 launch floor
compileSdk = "36"             # Android 16 = verified target device (ADR-001); re-check per GOS release
targetSdk = "36"
# AndroidX
coreKtx = "1.18.0"
lifecycle = "2.10.0"
activityCompose = "1.13.0"
composeBom = "2026.05.01"     # verify latest
# Kotlin libraries
coroutines = "1.11.0"
serialization = "1.11.0"
cbor = "1.8.1"                # kotlinx-serialization-cbor
# Self-contained privilege bridge (ADR-003): wireless-debugging pairing + TLS self-connect.
libadb = "3.1.1"              # com.github.MuntashirAkon (JitPack); dual GPL-3.0+/Apache-2.0, Apache elected
conscrypt = "2.5.3"           # public-API Conscrypt: pairing EKM export without hidden platform APIs
bcpkix = "1.81"               # X509v3CertificateBuilder for the ADB identity; matches transitive bcprov 1.81
# QR
zxingCore = "3.5.4"           # QR generation (sender)
zxingEmbedded = "4.3.0"       # journeyapps wrapper: BarcodeEncoder (send) + BarcodeView (recv); no GMS
# Crypto — SEE docs/prp/PROTOCOL.md §2. No canonical Maven Kotlin Noise lib exists;
# this is the Noise-library spike (VERIFY_FIRST #8). Placeholder until resolved.
# noise = "TBD"
# Test
junit = "4.13.2"
junitExt = "1.3.0"
truth = "1.4.4"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }
kotlinx-serialization-cbor = { module = "org.jetbrains.kotlinx:kotlinx-serialization-cbor", version.ref = "cbor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

libadb-android = { module = "com.github.MuntashirAkon:libadb-android", version.ref = "libadb" }
conscrypt-android = { module = "org.conscrypt:conscrypt-android", version.ref = "conscrypt" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk15to18", version.ref = "bcpkix" }

zxing-core = { module = "com.google.zxing:core", version.ref = "zxingCore" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }

junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "junitExt" }
truth = { module = "com.google.truth:truth", version.ref = "truth" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
