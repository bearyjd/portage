<?xml version="1.0" encoding="utf-8"?>
<!--
  portage — repo banner (1280×320) v3
  Hero canoe at left; wordmark + tagline right. No arc, no shore dots.

  Canoe in left panel (center 150,148), scaled ≈0.44× from logo.
  Outer hull: stern (38,88) → nadir (150,213) → bow (262,88) → sheer peak (150,50)
  Inner cavity: inset ~15px
  2 thwarts at x≈112 and x≈188
  Waterline beneath hull.

  Wordmark: single <text> + <tspan> — "port" #F2F5F4 + "age" #E9A23B, no gap.
  Copyright (C) 2026 Grepon Labs LLC. Licensed under AGPL-3.0.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="water-h" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0B2E38"/>
      <stop offset="50%" stop-color="#0E3A45"/>
      <stop offset="100%" stop-color="#0D3340"/>
    </linearGradient>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="50%" stop-color="#0E3A45" stop-opacity="0"/>
      <stop offset="100%" stop-color="#091F28" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="divider" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5FD0C6" stop-opacity="0"/>
      <stop offset="40%" stop-color="#5FD0C6" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#5FD0C6" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#water-h)"/>
  <rect width="1280" height="320" fill="url(#vignette)"/>

  <!-- Subtle waterline ripple texture -->
  <path d="M0,245 Q320,233 640,245 Q960,257 1280,245"
    fill="none" stroke="#5FD0C6" stroke-width="1" opacity="0.09"/>

  <!--
    CANOE — left panel, vertically centered in 320px.
    Outer hull x=38–262, tips at y≈88, nadir y=213, sheer peak y=50.
  -->

  <!-- Outer hull — aqua -->
  <path
    d="M38,88
       C42,140 96,215 150,215
       C204,215 258,140 262,88
       C254,40 200,50 150,50
       C100,50 46,40 38,88 Z"
    fill="#5FD0C6"/>

  <!-- Inner cavity -->
  <path
    d="M58,90
       C64,136 108,184 150,184
       C192,184 236,136 242,90
       C236,52 194,61 150,61
       C106,61 64,52 58,90 Z"
    fill="#0C3340"/>

  <!-- Thwart 1 at x≈112 -->
  <path
    d="M107,72 Q112,128 117,183"
    fill="none"
    stroke="#5FD0C6"
    stroke-width="9"
    stroke-linecap="round"/>

  <!-- Thwart 2 at x≈188 -->
  <path
    d="M183,72 Q188,128 193,183"
    fill="none"
    stroke="#5FD0C6"
    stroke-width="9"
    stroke-linecap="round"/>

  <!-- Keel -->
  <path
    d="M46,140 Q150,220 254,140"
    fill="none"
    stroke="#2A9990"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.65"/>

  <!-- Waterline -->
  <path
    d="M24,224 Q150,240 276,224"
    fill="none"
    stroke="#5FD0C6"
    stroke-width="6"
    stroke-linecap="round"
    opacity="0.48"/>

  <!-- Vertical divider -->
  <line x1="310" y1="36" x2="310" y2="284"
    stroke="url(#divider)" stroke-width="1.5"/>

  <!--
    WORDMARK — single <text> with inline <tspan> color switch.
    No x= on second tspan; flows continuously from "port" end — zero gap.
  -->
  <text
    x="348"
    y="174"
    font-family="'Helvetica Neue', Arial, system-ui, sans-serif"
    font-size="110"
    font-weight="700"
    letter-spacing="-3"><tspan fill="#F2F5F4">port</tspan><tspan fill="#E9A23B">age</tspan></text>

  <!-- Tagline -->
  <text
    x="350"
    y="222"
    font-family="'Helvetica Neue', Arial, system-ui, sans-serif"
    font-size="23"
    font-weight="300"
    letter-spacing="5.5"
    fill="#5FD0C6"
    opacity="0.88">carry your phone over.</text>

  <!-- Rule under tagline -->
  <line x1="350" y1="236" x2="860" y2="236"
    stroke="#5FD0C6" stroke-width="1" opacity="0.28"/>
</svg>
