# Dependabot — supply-chain hygiene for portage.
# Pairs with repo-level Dependabot alerts + automated security fixes (enabled out-of-band):
# alerts surface vulnerable transitive deps; the version-update jobs below keep the version
# catalog and CI actions current. Asked for by the Gap-2 and Gap-3 security reviews.
version: 2
updates:
  # Gradle: reads gradle/libs.versions.toml (the version catalog) + the build scripts.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the AndroidX/Compose churn instead of a dozen.
      androidx:
        patterns:
          - "androidx.*"
          - "com.google.android.*"
    ignore:
      # androidx.core 1.19.0+ hard-requires compileSdk 37 (AAR-metadata gate). portage is on AGP
      # 9.2.1 (that half of the old requirement is satisfied) but stays on compileSdk 36 = GOS
      # Android 16. Holding these back until the compileSdk-37 bump — a deliberate decision tied to
      # the GOS target (see ADR-005). Other androidx libs still update via the group above. Remove
      # these two entries then. (PR #16, 2026-06-11; AGP-9 half resolved by ADR-005, 2026-06-13.)
      - dependency-name: "androidx.core:core"
        versions: [">=1.19.0"]
      - dependency-name: "androidx.core:core-ktx"
        versions: [">=1.19.0"]
    # noise-java is VENDORED (in-tree, not a Gradle dependency), so it is out of scope here;
    # its update path is the manual verbatim-diff review tracked in ADR-002 §Follow-ups.

  # Keep the GitHub Actions in .github/workflows pinned-current (the build pins @v4 etc.).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci(deps)"
