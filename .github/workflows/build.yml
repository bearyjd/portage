name: build

on:
  push:
    branches: [main]
  pull_request:
  # Manual re-trigger. Added after a push event to main was DROPPED (2026-08-06, merge b5b2f7c):
  # GitHub created zero check-runs for the merge commit — not queued, not failed, absent — during
  # an Actions degradation that had already left a dependency-audit job hanging 2h30m. A dropped
  # push event cannot be replayed, and with no dispatch trigger the only ways to re-run these gates
  # on main were an empty commit or another merge. That left `main` carrying an unverified commit
  # with no in-band recourse, which is not an acceptable state for the branch that gates releases.
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-tests:
    # Fast lane: the safety-critical settings allowlist guardrails are pure-JVM and need
    # no Android SDK, so they gate every push in seconds (see docs/prp/DEVILS_ADVOCATE.md Q2).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Device-contract harness self-test
        # Runs first in the fast lane: pure bash, no SDK, no JVM, no phone — seconds.
        #
        # scripts/device-contract.sh is the only thing that gives a developer's device its
        # default-SMS app back after a contract run, and that logic shipped fail-open bugs that
        # survived review because observing them required attaching a phone and breaking adb in a
        # specific way. This drives the REAL script against a stub adb and asserts on the resulting
        # device state as well as the exit status, so "exited 0" and "actually restored" cannot
        # drift apart unnoticed. Sibling in spirit to scripts/test-boundary-gate.sh below.
        run: ./scripts/test-device-contract-harness.sh
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Settings-allowlist guardrails
        run: ./gradlew :settings-catalog:test --no-daemon --stacktrace

  android-build:
    # Full build: assembles both debug APKs. ubuntu-latest ships the Android SDK.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Self-test the privilege-boundary gates
        # Runs FIRST, before the ~15-minute assemble: it uses synthetic build-output fixtures, needs
        # no real APKs, and finishes in seconds — so a broken gate fails fast instead of at the end.
        #
        # This exists because the boundary step below is the ONLY enforcement of the privilege
        # boundary, and it shipped two independent fail-open bugs (PR #135) that CI could not see —
        # a gate that wrongly passes looks exactly like a gate that rightly passes. The self-test
        # extracts the REAL step bodies from this file and asserts they fail CLOSED on reader
        # failure, rather than re-implementing them (a copy would drift and prove nothing).
        run: ./scripts/test-boundary-gate.sh
      - name: Unit tests (core-model + core-transport + adb-bridge + wizard + providers + app-recv + app-send)
        # app-recv and app-send are flavored (distribution: degoogle/play, ADR-003) so their unit-test
        # tasks are per-flavor; both flavors run. The play variant exercises the Tier-0 no-bridge wiring
        # (PlayPrivilegeIntegrationTest), the degoogle variant the real ADB-bridge install adapters.
        run: ./gradlew :core-model:test :core-transport:testDebugUnitTest :adb-bridge:testDebugUnitTest :wizard:testDebugUnitTest :providers:testDebugUnitTest :app-recv:testDegoogleDebugUnitTest :app-recv:testPlayDebugUnitTest :app-send:testDegoogleDebugUnitTest :app-send:testPlayDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug and release APKs (both distribution flavors, both apps)
        # Release variants exercise R8/resource shrinking. They are unsigned CI artifacts and are
        # built as a release-readiness gate, not published.
        run: ./gradlew :app-recv:assembleDegoogleDebug :app-recv:assemblePlayDebug :app-send:assembleDegoogleDebug :app-send:assemblePlayDebug :app-recv:assembleDegoogleRelease :app-recv:assemblePlayRelease :app-send:assembleDegoogleRelease :app-send:assemblePlayRelease --no-daemon --stacktrace
      - name: Assert least-privilege boundaries across distribution flavors
        # Least-privilege gate, now flavor-aware (ADR-003 flavor split). Three invariants:
        #   1. portage-send (BOTH flavors) never declares secure-settings write, never carries the
        #      self-contained ADB bridge, and ships no bridge native libs — :adb-bridge has no edge into
        #      the sender at all.
        #   2. portage-recv PLAY (Tier-0-only) is provably bridge-FREE AND lite-restricted: no
        #      WRITE_SECURE_SETTINGS / adbbridge / conscrypt / spake2, AND no SMS/MMS/call-log/install
        #      surface or .sms. role components in the merged manifest (ADR-007 §6.3 #2). The load-bearing
        #      Google-Play-policy invariant — the play binary excludes these at build time, not no-ops them.
        #   3. portage-recv DEGOOGLE STILL carries the bridge (manifest WRITE_SECURE_SETTINGS + APK
        #      conscrypt/spake2) — the positive half that proves the patterns above are still meaningful
        #      AND that the source-set split works both ways (full on degoogle, none on play).
        run: |
          set -euo pipefail

          # Resolve the ONE merged manifest for a variant. Pin the SINGULAR 'merged_manifest' path
          # component + the exact variant dir (AGP's current output), so a stale legacy plural
          # 'merged_manifests/' dir on a warm checkout can't be picked; emit nothing (callers fail on
          # empty) unless exactly one manifest matches.
          find_manifest() {
            local hits n
            hits=$(find "$1/build/intermediates/merged_manifest/$2" -name AndroidManifest.xml 2>/dev/null)
            n=$(printf '%s\n' "$hits" | grep -c . || true)
            [ "$n" = 1 ] && printf '%s\n' "$hits"
          }
          # `|| true` so a MISSING output dir still reaches the caller's explicit "APK not found"
          # message instead of aborting the step with no diagnostic at all.
          find_apk() { find "$1/build/outputs/apk/$2" -name '*.apk' -print -quit 2>/dev/null || true; }

          # grep exits 0 = found, 1 = NOT found, >=2 = ERROR (unreadable file, bad pattern); a signal
          # kill gives 128+n. The FORBID loops below conclude "clean" from a non-match, so an ERROR
          # must never be allowed to read as "not found" — that is the same fail-open the normalize()
          # rewrite closed on the perl side, and it applies equally to the verdict greps themselves.
          contains() {
            local f="$1" re="$2" rc=0
            grep -qE "$re" "$f" || rc=$?
            case "$rc" in
              0) return 0 ;;
              1) return 1 ;;
              *) echo "::error::grep exited $rc scanning $f for /$re/ — refusing to evaluate" >&2; exit 1 ;;
            esac
          }

          # Same discrimination for the APK listings. Materialize the listing first so a failing
          # unzip is distinguishable from a listing that simply lacks the pattern.
          apk_contains() {
            local apk="$1" re="$2" rc=0 listing
            listing=$(unzip -l "$apk") \
              || { echo "::error::unzip failed to list $apk — refusing to evaluate" >&2; exit 1; }
            printf '%s\n' "$listing" | grep -qiE "$re" || rc=$?
            case "$rc" in
              0) return 0 ;;
              1) return 1 ;;
              *) echo "::error::grep exited $rc scanning the listing of $apk — refusing to evaluate" >&2; exit 1 ;;
            esac
          }

          WORK=$(mktemp -d)
          trap 'rm -rf "$WORK"' EXIT

          # Strip XML comments ONCE per variant into a file, then grep the FILE. The recv main
          # manifest's prose mentions "WRITE_SECURE_SETTINGS" / "ADB bridge" and the merged manifest
          # preserves comments, so a naive grep would false-positive on documentation.
          #
          # Every failure mode here is LOUD and FATAL, deliberately. The previous form piped
          # `perl ... | grep -q` inline per token, which made "the token is absent" and "perl did not
          # produce output" indistinguishable. In the FORBID loops below — which conclude *clean*
          # from a non-match — that combination fails OPEN: a manifest genuinely leaking
          # WRITE_SECURE_SETTINGS passed the gate if the perl invocation died. It also produced
          # spurious "lost an expected surface" failures on unrelated dependency-bump PRs, each
          # naming a different token (the tell that it was the reader failing, not the manifest).
          # A manifest we could not read must never be evaluated. Emits the normalized path.
          #
          # NOTE: this runs inside $( ), so diagnostics MUST go to stderr — anything on stdout is
          # captured as the returned path instead of reaching the log.
          normalize() {
            local label="$1" src="$2" out="$WORK/$3.xml"
            die() { echo "::error::$*" >&2; exit 1; }
            test -n "$src" || die "$label merged manifest not found"
            test -s "$src" || die "$label merged manifest is missing or empty: $src"
            perl -0777 -pe 's/<!--.*?-->//gs' "$src" > "$out" \
              || die "$label manifest comment-strip FAILED for $src — refusing to evaluate"
            test -s "$out" || die "$label normalized manifest is EMPTY ($src) — refusing to evaluate"
            # Sanity control on the normalized text itself: if these are gone we are not looking at
            # a real merged manifest, and every verdict below would be meaningless.
            grep -q '<manifest' "$out" || die "$label normalized manifest has no <manifest> root ($src)"
            grep -q 'uses-permission' "$out" \
              || die "$label normalized manifest declares NO permissions at all ($src) — implausible"
            printf '%s\n' "$out"
          }

          escalation_re='WRITE_SECURE_SETTINGS|com\.ventouxlabs\.portage\.adbbridge'
          bridge_lib_re='conscrypt|spake2'
          # DEGOOGLE-only surfaces (present in degoogle, ABSENT in play) — ADR-007 §6.3 #2. ONE source of
          # truth drives BOTH the play-forbid and the degoogle-require loops below, so they stay symmetric:
          # a drop from BOTH flavors (not just play) fails the degoogle positive control.
          lite_required_toks='android\.permission\.READ_SMS android\.permission\.SEND_SMS android\.permission\.RECEIVE_SMS android\.permission\.RECEIVE_MMS android\.permission\.RECEIVE_WAP_PUSH android\.permission\.WRITE_CALL_LOG android\.permission\.REQUEST_INSTALL_PACKAGES com\.ventouxlabs\.portage\.recv\.sms\.'
          # Also forbidden in PLAY as defense-in-depth, though portage declares it in NEITHER flavor
          # (call log is WRITE-only by design): catches a future regression that leaks it into lite.
          lite_forbidden_extra_toks='android\.permission\.READ_CALL_LOG'

          # --- 1. portage-send: both flavors clean (manifest + APK). ---
          for variant in degoogleDebug playDebug degoogleRelease playRelease; do
            # NOTE: bare assignment ON PURPOSE. `local body=$(normalize ...)` would make `local`'s
            # own status the command status and MASK a normalize() failure — silently reverting this
            # entire fix. Keep these assignments bare and out of `if`/pipeline contexts.
            body=$(normalize "send $variant" "$(find_manifest app-send "$variant")" "send-$variant")
            if contains "$body" "$escalation_re"; then
              echo "::error::portage-send ($variant) merged manifest leaks an escalation permission or the ADB bridge"
              exit 1
            fi
          done
          for path in degoogle/debug play/debug degoogle/release play/release; do
            apk=$(find_apk app-send "$path")
            test -f "$apk" || { echo "::error::sender APK not found at $path"; exit 1; }
            if apk_contains "$apk" "$bridge_lib_re"; then
              echo "::error::portage-send APK ($path) contains ADB-bridge native libraries — a privilege dependency leaked into the sender"
              exit 1
            fi
          done

          # --- 2. portage-recv PLAY: must be bridge-FREE AND lite-restricted (manifest + APK). ---
          for variant in playDebug playRelease; do
            body=$(normalize "recv $variant" "$(find_manifest app-recv "$variant")" "recv-play-$variant")
            if contains "$body" "$escalation_re"; then
              echo "::error::portage-recv $variant merged manifest carries WRITE_SECURE_SETTINGS or the ADB bridge"
              exit 1
            fi
            # ADR-007 §6.3 #2: lite must declare NO SMS/MMS/call-log/install surface or .sms. role component.
            for tok in $lite_required_toks $lite_forbidden_extra_toks; do
              if contains "$body" "$tok"; then
                echo "::error::portage-recv PLAY ($variant) merged manifest declares a lite-forbidden surface: $tok"
                exit 1
              fi
            done
          done
          for path in play/debug play/release; do
            recv_play_apk=$(find_apk app-recv "$path")
            test -f "$recv_play_apk" || { echo "::error::recv play APK not found at $path"; exit 1; }
            if apk_contains "$recv_play_apk" "$bridge_lib_re"; then
              echo "::error::portage-recv PLAY APK ($path) contains ADB-bridge native libs"
              exit 1
            fi
          done

          # --- 3. portage-recv DEGOOGLE: bridge + lite-restricted surfaces PRESENT (positive control —
          #        proves the source-set split works BOTH ways: full on degoogle, none on play). ---
          for variant in degoogleDebug degoogleRelease; do
            body=$(normalize "recv $variant" "$(find_manifest app-recv "$variant")" "recv-degoogle-$variant")
            if ! contains "$body" 'WRITE_SECURE_SETTINGS'; then
              echo "::error::recv $variant merged manifest lacks WRITE_SECURE_SETTINGS"
              exit 1
            fi
            # The degoogle manifest MUST still carry the FULL surface (ADR-007 §6.3 #2) — the SAME token set
            # the play loop forbids, so a drop from BOTH flavors (not just play) fails here.
            for tok in $lite_required_toks; do
              if ! contains "$body" "$tok"; then
                echo "::error::recv DEGOOGLE ($variant) merged manifest lost an expected surface: $tok"
                exit 1
              fi
            done
          done
          for path in degoogle/debug degoogle/release; do
            recv_degoogle_apk=$(find_apk app-recv "$path")
            test -f "$recv_degoogle_apk" || { echo "::error::recv degoogle APK not found at $path"; exit 1; }
            if ! apk_contains "$recv_degoogle_apk" "$bridge_lib_re"; then
              echo "::error::recv DEGOOGLE APK ($path) lacks expected ADB-bridge native libs"
              exit 1
            fi
          done
      - name: Assert 16 KB page alignment of shipped native libraries (ADR-003 §7.7)
        # Android is moving to 16 KB memory pages; a misaligned .so hard-fails to load there. Two
        # independent requirements, BOTH checked, because either one alone lets a broken APK through:
        #   1. ZIP level  — each .so entry must be STORED (uncompressed) at a 16 KB offset in the APK.
        #   2. ELF level  — each LOAD segment's p_align must be >= 0x4000 (16384).
        # portage builds no native code itself; these libs are PREBUILT (libadb-android's spake2,
        # conscrypt, and Compose's androidx.graphics.path), so this is a DETECTION gate on the pinned
        # dependency set — a dependency bump that regresses alignment must fail here, not on a user's
        # 16 KB device. Verified passing on the current pins (12/12 libs at 0x4000).
        run: |
          set -euo pipefail
          zipalign=$(ls -d "${ANDROID_HOME:?}"/build-tools/*/zipalign 2>/dev/null | sort -V | tail -1 || true)
          test -n "$zipalign" || { echo "::error::zipalign not found under $ANDROID_HOME/build-tools"; exit 1; }
          command -v readelf >/dev/null || { echo "::error::readelf not available"; exit 1; }

          WORK=$(mktemp -d); trap 'rm -rf "$WORK"' EXIT
          total_libs=0

          # Release variants are the release gate, but debug ships the same prebuilts — check both so a
          # regression surfaces on the PR that introduces it.
          # Flavored outputs nest as apk/<flavor>/<buildType>/*.apk, so match at any depth under apk/.
          apks=$(find app-recv app-send -path '*/build/outputs/apk/*' -name '*.apk' | sort)
          test -n "$apks" || { echo "::error::no APKs found to check"; exit 1; }

          for apk in $apks; do
            # 1. ZIP level.
            if ! "$zipalign" -c -P 16 -v 4 "$apk" > "$WORK/za.txt" 2>&1; then
              echo "::error::$apk fails 16 KB zip page alignment (zipalign -c -P 16)"
              grep -iE '\.so' "$WORK/za.txt" | grep -viE '\(OK' | head -20 || true
              exit 1
            fi

            # 1b. STORED check. zipalign reports a COMPRESSED entry as "(OK - compressed)" and skips the
            # alignment requirement for it, so step 1 alone lets a compressed .so through — and a
            # compressed native lib cannot be mmap'd at any page size. Require method Stored explicitly.
            if unzip -lv "$apk" | awk '$NF ~ /\.so$/ && $2 != "Stored" { print; found=1 } END { exit !found }'; then
              echo "::error::$apk ships COMPRESSED native libraries (listed above) — must be STORED for mmap"
              exit 1
            fi

            # 2. ELF level. Extract and inspect every LOAD segment of every .so.
            rm -rf "$WORK/x"; mkdir -p "$WORK/x"
            unzip -qq -o "$apk" 'lib/*' -d "$WORK/x" 2>/dev/null || true
            libs=$(find "$WORK/x" -name '*.so' 2>/dev/null | sort)
            n=$(printf '%s\n' "$libs" | grep -c . || true)
            echo "checked $apk — $n native lib(s)"
            total_libs=$((total_libs + n))
            [ "$n" = 0 ] && continue
            for so in $libs; do
              rel=${so#"$WORK/x/"}
              # Every LOAD line's last field is the alignment, e.g. 0x4000. Require >= 16384.
              aligns=$(readelf -lW "$so" | awk '$1=="LOAD"{print $NF}' | sort -u)
              test -n "$aligns" || { echo "::error::$apk :: $rel has no LOAD segments — unreadable ELF"; exit 1; }
              for a in $aligns; do
                if [ "$((a))" -lt 16384 ]; then
                  echo "::error::$apk :: $rel LOAD p_align=$a (< 0x4000) — not 16 KB page compatible"
                  exit 1
                fi
              done
            done
          done

          # Fail closed: passing because we inspected NOTHING is the failure mode this repo already got
          # bitten by once (see the manifest-boundary step above). The bridge flavors ship real libs.
          test "$total_libs" -gt 0 || { echo "::error::inspected 0 native libraries — the check did not actually run"; exit 1; }
          echo "16 KB alignment OK across $total_libs native libraries"
      - name: Assert raw AdbBridge.shell() stays inside the privilege modules
        # ADR-003 §1 call-site rule, made durable: raw .shell() may be called ONLY from within
        # :adb-bridge itself. :wizard IS intentionally included in the scanned (forbidden) module
        # list below — it is a privileged consumer of AdbBridge but must go through the typed
        # operations (pair/connect/probeCapabilities/disconnect) only, never raw shell(). Keep
        # :wizard in this list; removing it would silently widen the privilege boundary. CLAUDE.md
        # and AdbBridge.kt's comments describe this same rule — keep all three in sync.
        run: |
          set -euo pipefail
          if grep -rn '\.shell(' --include='*.kt' app-recv app-send providers core-model core-transport settings-catalog wizard | grep -vE '/(test|androidTest)[A-Za-z]*/'; then
            echo "::error::raw AdbBridge.shell() call outside :adb-bridge — use a typed operation"
            exit 1
          fi
      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: portage-debug-apks
          # Flavored output dirs: app-*/build/outputs/apk/<flavor>/debug/*.apk
          path: '**/build/outputs/apk/*/debug/*.apk'
          if-no-files-found: error
