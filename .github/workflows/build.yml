name: build

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    # Fast lane: the safety-critical settings allowlist guardrails are pure-JVM and need
    # no Android SDK, so they gate every push in seconds (see docs/prp/DEVILS_ADVOCATE.md Q2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Settings-allowlist guardrails
        run: gradle :settings-catalog:test --no-daemon --stacktrace

  android-build:
    # Full build: assembles both debug APKs. ubuntu-latest ships the Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Unit tests (core-model + core-transport + privileged + providers + app-recv + app-send)
        run: gradle :core-model:test :core-transport:testDebugUnitTest :privileged:testDebugUnitTest :providers:testDebugUnitTest :app-recv:testDebugUnitTest :app-send:testDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APKs
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Assert portage-send carries no escalation surface
        # Least-privilege gate: the sender must never declare secure-settings write, the Shizuku
        # API permission, or the Shizuku provider — all of which can reach it only by transitive
        # manifest merge (app-send → :providers → :privileged). app-send strips them via
        # tools:node="remove"; this fails the build if the merged manifest regresses.
        run: |
          set -euo pipefail
          manifest=$(find app-send/build/intermediates -path '*merged_manifest*/AndroidManifest.xml' | head -1)
          test -n "$manifest" || { echo "::error::merged sender manifest not found"; exit 1; }
          if grep -qE 'WRITE_SECURE_SETTINGS|shizuku.manager.permission.API_V23|rikka\.shizuku\.ShizukuProvider' "$manifest"; then
            echo "::error::portage-send merged manifest leaks an escalation permission or the Shizuku provider"
            exit 1
          fi
      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: portage-debug-apks
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
