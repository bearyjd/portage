name: build

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm-tests:
    # Fast lane: the safety-critical settings allowlist guardrails are pure-JVM and need
    # no Android SDK, so they gate every push in seconds (see docs/prp/DEVILS_ADVOCATE.md Q2).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
      - name: Settings-allowlist guardrails
        run: gradle :settings-catalog:test --no-daemon --stacktrace

  android-build:
    # Full build: assembles both debug APKs. ubuntu-latest ships the Android SDK.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.1'
      - name: Unit tests (core-model + core-transport + adb-bridge + wizard + providers + app-recv + app-send)
        # app-recv and app-send are flavored (distribution: degoogle/play, ADR-003) so their unit-test
        # tasks are per-flavor; both flavors run. The play variant exercises the Tier-0 no-bridge wiring
        # (PlayPrivilegeIntegrationTest), the degoogle variant the real ADB-bridge install adapters.
        run: gradle :core-model:test :core-transport:testDebugUnitTest :adb-bridge:testDebugUnitTest :wizard:testDebugUnitTest :providers:testDebugUnitTest :app-recv:testDegoogleDebugUnitTest :app-recv:testPlayDebugUnitTest :app-send:testDegoogleDebugUnitTest :app-send:testPlayDebugUnitTest --no-daemon --stacktrace
      - name: Assemble debug APKs (both distribution flavors, both apps)
        run: gradle :app-recv:assembleDegoogleDebug :app-recv:assemblePlayDebug :app-send:assembleDegoogleDebug :app-send:assemblePlayDebug --no-daemon --stacktrace
      - name: Assert least-privilege boundaries across distribution flavors
        # Least-privilege gate, now flavor-aware (ADR-003 flavor split). Three invariants:
        #   1. portage-send (BOTH flavors) never declares secure-settings write, never carries the
        #      self-contained ADB bridge, and ships no bridge native libs — :adb-bridge has no edge into
        #      the sender at all.
        #   2. portage-recv PLAY (Tier-0-only) is provably bridge-FREE: no WRITE_SECURE_SETTINGS, no
        #      com.ventouxlabs.portage.adbbridge in the merged manifest, and no conscrypt/spake2 native
        #      libs in the APK. This is the load-bearing Google-Play-policy invariant — the play binary
        #      must exclude :adb-bridge at compile time, not merely no-op it.
        #   3. portage-recv DEGOOGLE STILL carries the bridge (manifest WRITE_SECURE_SETTINGS + APK
        #      conscrypt/spake2) — the positive half that proves the patterns above are still meaningful
        #      AND that the source-set split works both ways (full on degoogle, none on play).
        run: |
          set -euo pipefail

          find_manifest() { find "$1/build/intermediates" -path "*merged_manifest*$2*AndroidManifest.xml" | head -1; }
          find_apk() { find "$1/build/outputs/apk/$2" -name '*.apk' | head -1; }
          # Strip XML comments before grepping: the recv main manifest's prose mentions
          # "WRITE_SECURE_SETTINGS" / "ADB bridge" and the merged manifest preserves comments, so a
          # naive grep would false-positive on documentation rather than a real declaration.
          manifest_body() { perl -0777 -pe 's/<!--.*?-->//gs' "$1"; }

          escalation_re='WRITE_SECURE_SETTINGS|com\.ventouxlabs\.portage\.adbbridge'
          bridge_lib_re='conscrypt|spake2'

          # --- 1. portage-send: both flavors clean (manifest + APK). ---
          for variant in degoogleDebug playDebug; do
            m=$(find_manifest app-send "$variant")
            test -n "$m" || { echo "::error::send $variant merged manifest not found"; exit 1; }
            if manifest_body "$m" | grep -qE "$escalation_re"; then
              echo "::error::portage-send ($variant) merged manifest leaks an escalation permission or the ADB bridge"
              exit 1
            fi
          done
          for path in degoogle/debug play/debug; do
            apk=$(find_apk app-send "$path")
            test -f "$apk" || { echo "::error::sender APK not found at $path"; exit 1; }
            if unzip -l "$apk" | grep -qiE "$bridge_lib_re"; then
              echo "::error::portage-send APK ($path) contains ADB-bridge native libraries — a privilege dependency leaked into the sender"
              exit 1
            fi
          done

          # --- 2. portage-recv PLAY: must be bridge-FREE (manifest + APK). ---
          recv_play_manifest=$(find_manifest app-recv playDebug)
          test -n "$recv_play_manifest" || { echo "::error::recv playDebug merged manifest not found"; exit 1; }
          if manifest_body "$recv_play_manifest" | grep -qE "$escalation_re"; then
            echo "::error::portage-recv PLAY merged manifest carries WRITE_SECURE_SETTINGS or the ADB bridge — the play flavor must exclude :adb-bridge"
            exit 1
          fi
          recv_play_apk=$(find_apk app-recv play/debug)
          test -f "$recv_play_apk" || { echo "::error::recv play APK not found"; exit 1; }
          if unzip -l "$recv_play_apk" | grep -qiE "$bridge_lib_re"; then
            echo "::error::portage-recv PLAY APK contains ADB-bridge native libs (conscrypt/spake2) — :adb-bridge leaked into the play flavor"
            exit 1
          fi

          # --- 3. portage-recv DEGOOGLE: bridge present (proves the patterns + the split are meaningful). ---
          recv_degoogle_manifest=$(find_manifest app-recv degoogleDebug)
          test -n "$recv_degoogle_manifest" || { echo "::error::recv degoogleDebug merged manifest not found"; exit 1; }
          if ! manifest_body "$recv_degoogle_manifest" | grep -qE 'WRITE_SECURE_SETTINGS'; then
            echo "::error::recv DEGOOGLE merged manifest lacks WRITE_SECURE_SETTINGS — the play negative check is stale"
            exit 1
          fi
          recv_degoogle_apk=$(find_apk app-recv degoogle/debug)
          test -f "$recv_degoogle_apk" || { echo "::error::recv degoogle APK not found"; exit 1; }
          if ! unzip -l "$recv_degoogle_apk" | grep -qiE "$bridge_lib_re"; then
            echo "::error::recv DEGOOGLE APK lacks the expected ADB-bridge native libs — the bridge-free pattern is stale"
            exit 1
          fi
      - name: Assert raw AdbBridge.shell() stays inside the privilege modules
        # ADR-003 §1 call-site rule, made durable: only :adb-bridge (and :wizard via typed ops)
        # may touch the raw shell. Typed operations are the public surface everywhere else.
        run: |
          set -euo pipefail
          if grep -rn '\.shell(' --include='*.kt' app-recv app-send providers core-model core-transport settings-catalog wizard | grep -v '/test/'; then
            echo "::error::raw AdbBridge.shell() call outside :adb-bridge — use a typed operation"
            exit 1
          fi
      - name: Upload debug APKs
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: portage-debug-apks
          # Flavored output dirs: app-*/build/outputs/apk/<flavor>/debug/*.apk
          path: '**/build/outputs/apk/*/debug/*.apk'
          if-no-files-found: error
