name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  signed-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      # This job materializes the release signing key, so every third-party action is pinned to a
      # full commit SHA (mutable tags like @v6 are a supply-chain path to the keystore). Update the
      # trailing version comment and the SHA together.
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The release gate below must be able to prove that the tagged commit is in main.
          fetch-depth: 0
      - uses: actions/setup-java@1bcf9fb12cf4aa7d266a90ae39939e61372fe520 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6

      - name: Require the tagged commit to be in main
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main || {
            echo "::error::release tag must point to a commit contained in main"
            exit 1
          }

      - name: Derive Android version from tag
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          IFS=. read -r major minor patch <<< "$version"
          for part in "$major" "$minor" "$patch"; do
            [[ "$part" =~ ^[0-9]+$ ]] || { echo "::error::invalid release tag"; exit 1; }
          done
          (( minor < 1000 && patch < 1000 )) || {
            echo "::error::minor and patch versions must be below 1000"
            exit 1
          }
          code=$((10#$major * 1000000 + 10#$minor * 1000 + 10#$patch))
          (( code > 0 && code <= 2100000000 )) || {
            echo "::error::derived Android versionCode is out of range"
            exit 1
          }
          echo "PORTAGE_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "PORTAGE_VERSION_CODE=$code" >> "$GITHUB_ENV"

      - name: Materialize release keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.PORTAGE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || {
            echo "::error::PORTAGE_KEYSTORE_BASE64 is not configured in the release environment"
            exit 1
          }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/portage-release.jks"
          chmod 600 "$RUNNER_TEMP/portage-release.jks"

      - name: Build signed, minified APKs
        env:
          PORTAGE_KEYSTORE_PATH: ${{ runner.temp }}/portage-release.jks
          PORTAGE_KEYSTORE_PASSWORD: ${{ secrets.PORTAGE_KEYSTORE_PASSWORD }}
          PORTAGE_KEY_ALIAS: ${{ secrets.PORTAGE_KEY_ALIAS }}
          PORTAGE_KEY_PASSWORD: ${{ secrets.PORTAGE_KEY_PASSWORD }}
        run: |
          # --no-configuration-cache: signing inputs are read at configuration time, so the
          # config cache would serialize keystore passwords under .gradle/ on the runner.
          ./gradlew \
            :app-recv:assembleDegoogleRelease :app-recv:assemblePlayRelease \
            :app-send:assembleDegoogleRelease :app-send:assemblePlayRelease \
            -PportageVersionName="$PORTAGE_VERSION_NAME" \
            -PportageVersionCode="$PORTAGE_VERSION_CODE" \
            --no-configuration-cache --no-daemon --stacktrace

      - name: Verify signatures and create checksums
        shell: bash
        env:
          EXPECTED_SIGNING_CERT_SHA256: ${{ vars.PORTAGE_SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          expected=$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" |
            tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          [[ "$expected" =~ ^[0-9a-f]{64}$ ]] || {
            echo "::error::PORTAGE_SIGNING_CERT_SHA256 must be configured as a 64-digit SHA-256 digest in the release environment"
            exit 1
          }
          mkdir -p dist
          find app-recv/build/outputs/apk app-send/build/outputs/apk \
            -path '*/release/*.apk' -type f -exec cp {} dist/ \;
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 4 || {
            echo "::error::expected exactly four release APKs"
            exit 1
          }
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -x "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          for apk in dist/*.apk; do
            certs=$("$apksigner" verify --verbose --print-certs "$apk")
            printf '%s\n' "$certs"
            actual=$(printf '%s\n' "$certs" |
              sed -n 's/^Signer #1 certificate SHA-256 digest: //p' |
              tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
            [[ "$actual" == "$expected" ]] || {
              echo "::error::$(basename "$apk") was not signed by the pinned release certificate"
              exit 1
            }
          done
          cd dist
          sha256sum ./*.apk > SHA256SUMS

      - name: Assert privilege-boundary invariants on the signed artifacts
        # build.yml gates these on CI artifacts; re-assert on the exact APKs we are about to publish
        # (SECURITY.md lists sender / Play-flavor bridge contamination as high-priority). The degoogle
        # receiver must carry the bridge native libs; everything else must be bridge-free.
        shell: bash
        run: |
          set -euo pipefail
          bridge_lib_re='conscrypt|spake2'
          # aapt decodes the binary (AXML) manifest packaged in the APK, so we assert the
          # actual shipped permissions — not just native-lib presence. build.yml checks the
          # plaintext merged-manifest intermediate; here only the APK exists.
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -x "$aapt" || { echo "::error::aapt not found"; exit 1; }

          # grep exits 0 = found, 1 = NOT found, >=2 = ERROR. The bridge-free branches below conclude
          # "clean" from a non-match, so an ERROR must never read as "not found" — otherwise a failing
          # reader silently publishes a SIGNED artifact that was never actually checked. Same fail-open
          # class fixed in build.yml's boundary step; this is the LAST gate before release.
          text_contains() {
            local re="$1" rc=0; shift
            printf '%s\n' "$*" | grep -qE "$re" || rc=$?
            case "$rc" in 0) return 0 ;; 1) return 1 ;;
              *) echo "::error::grep exited $rc scanning permissions — refusing to evaluate" >&2; exit 1 ;; esac
          }
          apk_contains() {
            local apk="$1" re="$2" rc=0 listing
            listing=$(unzip -l "$apk") \
              || { echo "::error::unzip failed to list $apk — refusing to evaluate" >&2; exit 1; }
            printf '%s\n' "$listing" | grep -qiE "$re" || rc=$?
            case "$rc" in 0) return 0 ;; 1) return 1 ;;
              *) echo "::error::grep exited $rc scanning the listing of $apk — refusing to evaluate" >&2; exit 1 ;; esac
          }

          for apk in dist/*.apk; do
            name=$(basename "$apk")
            perms=$("$aapt" dump permissions "$apk")
            # An EMPTY dump would make every bridge-free assertion below vacuously true. aapt
            # succeeding with no output is not evidence of a clean manifest.
            test -n "$perms" || { echo "::error::aapt produced an EMPTY permission dump for $name — refusing to evaluate"; exit 1; }
            case "$name" in
              *send*|*recv-play*)
                if apk_contains "$apk" "$bridge_lib_re"; then
                  echo "::error::$name must be bridge-free but contains ADB-bridge native libs"
                  exit 1
                fi
                if text_contains 'WRITE_SECURE_SETTINGS' "$perms"; then
                  echo "::error::$name must be bridge-free but declares WRITE_SECURE_SETTINGS"
                  exit 1
                fi ;;
              *recv-degoogle*)
                if ! apk_contains "$apk" "$bridge_lib_re"; then
                  echo "::error::$name (degoogle receiver) lacks expected ADB-bridge native libs"
                  exit 1
                fi
                if ! text_contains 'WRITE_SECURE_SETTINGS' "$perms"; then
                  echo "::error::$name (degoogle receiver) lacks expected WRITE_SECURE_SETTINGS"
                  exit 1
                fi ;;
              *)
                echo "::error::unexpected release APK name: $name"
                exit 1 ;;
            esac
          done

      - name: Retain R8 deobfuscation mappings
        # Minified releases need mapping.txt to deobfuscate field crash reports after the runner
        # is destroyed. Kept in dist/mapping/ → captured by the workflow artifact upload below, but
        # NOT attached to the public GitHub release (which lists only dist/*.apk + SHA256SUMS).
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/mapping
          while IFS= read -r -d '' m; do
            module=$(echo "$m" | cut -d/ -f1)          # app-recv / app-send
            variant=$(basename "$(dirname "$m")")       # degoogleRelease / playRelease
            cp "$m" "dist/mapping/$module-$variant-mapping.txt"
          done < <(find app-recv/build/outputs/mapping app-send/build/outputs/mapping \
            -name mapping.txt -path '*Release*' -type f -print0)
          test "$(find dist/mapping -name '*-mapping.txt' | wc -l)" -eq 4 || {
            echo "::error::expected four R8 mapping files"
            exit 1
          }

      - name: Upload signed release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: portage-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS \
            --verify-tag \
            --title "portage $PORTAGE_VERSION_NAME" \
            --generate-notes

      - name: Shred the release keystore
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/portage-release.jks"
