name: dependency-audit

# Build-failing CVE gate (CLAUDE.md "Open security follow-ups"): Dependabot opens update PRs
# and raises alerts, but is NOT a gate. This job resolves the real transitive dependency graph
# that ships in the APKs and FAILS the build if OSV reports a known advisory against any of it —
# the de-risking step the libadb-android / spake2 introduction (ADR-003) made overdue.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a CVE newly disclosed against an UNCHANGED dependency still trips the gate.
    - cron: '17 6 * * 1'
  # Manual re-trigger — see the same note in build.yml. This gate additionally needs it because a
  # run can be CANCELLED (no runner) rather than failing, and `gh pr checks` renders that as a bare
  # `fail` on a security gate. Being able to re-run on demand is the difference between confirming
  # "infrastructure, not an advisory" and merging past a red you never explained.
  workflow_dispatch:

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  osv-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a hung jitpack/maven fetch shouldn't burn the GitHub 6h default
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6

      - name: Generate dependency lockfiles (CI-only, not committed)
        # The init script enables locking + a resolve task ONLY for the two APK modules; their
        # runtime classpaths transitively cover every shipped dependency. Flavor-aware (ADR-003):
        # both apps carry degoogle + play flavors, so this resolves every per-flavor runtime
        # classpath — the PLAY recv graph is locked alongside degoogle, and the lockfile pins the
        # libadb/spake2/conscrypt chain to the degoogle configurations only (provably absent from
        # the play configs). Writes app-recv/gradle.lockfile and app-send/gradle.lockfile.
        # --no-configuration-cache is required by --write-locks.
        run: |
          ./gradlew --init-script .github/osv/locking.init.gradle.kts \
            :app-recv:osvResolveForLocks :app-send:osvResolveForLocks \
            --write-locks --no-configuration-cache --no-daemon --stacktrace

      - name: Verify lockfiles were produced
        # Fail loudly if lock generation silently produced nothing — otherwise the scan below
        # would pass vacuously (a green gate that audits nothing is worse than no gate).
        run: |
          set -euo pipefail
          test -s app-recv/gradle.lockfile || { echo "::error::app-recv/gradle.lockfile missing or empty — the audit would scan nothing"; exit 1; }
          test -s app-send/gradle.lockfile || { echo "::error::app-send/gradle.lockfile missing or empty — the audit would scan nothing"; exit 1; }

      - name: OSV-Scanner (fails the build on a known advisory)
        # Recursive scan of the tree picks up the two gradle.lockfiles generated above. The
        # action exits non-zero when OSV reports a vulnerability (and exit 128 on an empty scan),
        # which fails this required check. Triaged residuals go in osv-scanner.toml (auto-detected
        # at repo root on a recursive scan) with justification. Pinned to the v2.3.8 commit SHA:
        # upstream warns the scanner action's behavior may change in a patch release, so we pin
        # immutably; Dependabot (github-actions) still bumps SHA-pinned actions.
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --recursive
            ./
